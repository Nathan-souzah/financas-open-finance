services:
  - type: web
    name: financas-open-finance
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm install --global pnpm@9.12.0 && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22.13.0"
      - key: OPEN_FINANCE_PROVIDER
        value: pluggy
      - key: PLUGGY_CLIENT_ID
        sync: false
      - key: PLUGGY_CLIENT_SECRET
        sync: false
      - key: EXPO_PUBLIC_API_BASE_URL
        sync: false
